<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1762c2"><title>Sell Product - M-Yusrah Business</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="side-head"><h2>M-Yusrah</h2><button id="closeMenu">×</button></div>
<a href="dashboard.html">⌂ Home</a><a href="addproduct.html">⊕ Add Product</a><a class="active" href="sellproduct.html">⊖ Sell Product</a><a href="history.html">◷ History</a><a href="analytics.html">▥ Products Analysis</a></aside>
<div class="overlay" id="overlay"></div>
<header class="topbar"><button class="menu-btn" id="menuBtn"><span>☰</span></button><div class="brand">M-Yusrah Business</div><div class="done">✓</div></header>
<main class="page-content">
<h1>Sell a product</h1>
<form class="form-card sell-form" id="sellProductForm">
<select id="sellSelect" required><option value="">select product</option></select>
<div class="sell-info">
  <div><label>Quantity</label><div class="qty-control"><button type="button" id="minusQty">‹</button><input id="sellQuantityInput" class="qty-input-direct" type="number" min="1" step="1" placeholder="0"><button type="button" id="plusQty">›</button></div></div>
  <div class="price-preview"><label>Total price</label><strong id="pricePreview">₦0</strong></div>
</div>
<input id="discount" type="number" min="0" step="0.01" placeholder="Discount (optional)">
<input id="clientName" type="text" placeholder="Client Name" required>
<button class="submit-btn" type="submit">⊖ Sell Product</button>
</form>
<a class="back-btn" href="dashboard.html">Back Home</a>
</main><div class="modal" id="receiptModal"><div class="receipt-modal-box"><div id="receiptContent"></div><div class="receipt-actions"><button class="share-btn" id="shareReceipt">⇧ Share Receipt</button><button class="confirm" id="okReceipt">OK</button></div></div></div>
<script src="app.js"></script>
</body></html>
