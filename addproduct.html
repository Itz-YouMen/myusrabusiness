<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1762c2"><title>Add Product - Y-M Business Analysis</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head"><h2>Y-M</h2><button id="closeMenu">×</button></div>
    <a href="dashboard.html">⌂ Home</a><a class="active" href="addproduct.html">⊕ Add Product</a>
    <a href="sellproduct.html">⊖ Sell Product</a><a href="history.html">◷ History</a><a href="analytics.html">▥ Products Analysis</a>
  </aside><div class="overlay" id="overlay"></div>
  <header class="topbar"><button class="menu-btn" id="menuBtn"><span>☰</span></button><div class="brand">Y-M Business Analysis</div><div class="done">✓</div></header>
  <main class="page-content">
    <h1>Add a product</h1>
    <form class="form-card" id="addProductForm">
      <input id="productName" type="text" placeholder="product name" required>
      <input id="buyPrice" type="number" min="0" step="0.01" placeholder="buyed price" required>
      <input id="sellPrice" type="number" min="0" step="0.01" placeholder="sell price" required>
      <input id="quantity" type="number" min="1" step="1" placeholder="Quantity" required>
      <button class="submit-btn" type="submit">⊕ Add Product</button>
    </form>
    <a class="back-btn" href="dashboard.html">Back Home</a>
  </main>
</div>
<script src="app.js"></script>
</body></html>
