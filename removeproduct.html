<main class="page-content">
<h1>Remove a product</h1>
<form class="form-card" id="removeProductForm">
<select id="removeSelect" required><option value="">select product</option></select>
<div class="selected-product-info" id="selectedProductInfo">Select a product to see its available quantity.</div>
<label class="remove-choice"><input type="radio" name="removeMode" value="all" checked> Delete entire product</label>
<label class="remove-choice"><input type="radio" name="removeMode" value="quantity"> Delete specific quantity</label>
<input id="removeQuantity" type="number" min="1" step="1" placeholder="How many do you want to delete?" disabled>
<button class="remove-submit" type="submit">− Remove Product</button>
</form>
