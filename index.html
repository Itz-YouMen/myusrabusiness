<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1762c2">
<title>Login - M-Yusrah Business</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="login-page">
  <div class="login-logo">M</div>
  <h1>M-Yusrah Business</h1>
  <p>Login to manage your business</p>
  <form class="login-card" id="loginForm">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
    <button type="submit" class="login-btn">Login →</button>
    <div id="loginError"></div>
  </form>
  <small>Business Management System</small>
</div>
<script src="app.js"></script>
</body>
</html>
